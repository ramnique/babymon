services:
  caddy:
    image: caddy:2
    restart: unless-stopped
    ports:
      - '80:80'
      - '443:443'
      - '443:443/udp' # HTTP/3
    volumes:
      - ./docker/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    environment:
      PUBLIC_HOST: ${PUBLIC_HOST:?set PUBLIC_HOST in .env}

  app:
    build:
      context: .
      dockerfile: docker/Dockerfile
    restart: unless-stopped
    # No host port needed — Caddy proxies to it on the compose network.
    # Uncomment to also reach the app directly (e.g. LAN use without TLS):
    # ports:
    #   - '8080:8080'
    environment:
      TURN_SECRET: ${TURN_SECRET:?set TURN_SECRET in .env}
      TURN_URLS: turn:${PUBLIC_HOST:?set PUBLIC_HOST in .env}:3478?transport=udp,turn:${PUBLIC_HOST}:3478?transport=tcp
      STUN_URLS: ${STUN_URLS:-stun:stun.l.google.com:19302}

  coturn:
    image: coturn/coturn:4
    restart: unless-stopped
    # Host networking: TURN needs a range of UDP relay ports; mapping them
    # individually through Docker NAT is slow and error-prone.
    network_mode: host
    command: >-
      -n
      --listening-port=3478
      --min-port=49160
      --max-port=49200
      --use-auth-secret
      --static-auth-secret=${TURN_SECRET}
      --realm=${PUBLIC_HOST}
      --fingerprint
      --no-cli
      --no-multicast-peers
      --no-tlsv1
      --no-tlsv1_1

volumes:
  caddy_data: # TLS certificates persist across restarts
  caddy_config:
